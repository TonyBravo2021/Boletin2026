<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Boletín Estadístico UGEL 07 · 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Source+Sans+3:wght@300;400;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">

<!-- ESTILOS (carpeta css/) -->
<link rel="stylesheet" href="css/libro.css">
<link rel="stylesheet" href="css/contenido.css">
<link rel="stylesheet" href="css/tapas-y-controles.css">
<link rel="stylesheet" href="css/graficos-y-texto.css">
</head>
<body>

<div class="stage">
  <div class="book" id="book">
    <div class="book-inner" id="bookInner">
      <div class="sombra"></div>
      <button class="zona prev" id="zPrev" aria-label="Página anterior"></button>
      <button class="zona next" id="zNext" aria-label="Página siguiente"></button>
    </div>
    <div class="gutter"></div>
  </div>
</div>

<!-- CONTROLES -->
<nav class="barra" aria-label="Controles del boletín">
  <div class="progreso" id="progreso" title="Ir a una posición"><i id="progressBar"></i></div>
  <div class="fila">
    <button class="btn" id="bToc" title="Índice (I)" aria-label="Índice">☰</button>
    <span class="sep esc"></span>
    <button class="btn esc" id="bFirst" title="Portada (Inicio)" aria-label="Ir a la portada">«</button>
    <button class="btn grande" id="bPrev" title="Anterior (←)" aria-label="Anterior">‹</button>
    <div class="pagina">
      <span id="pageInfo">Portada</span>
      <input id="pageInput" type="number" min="1" value="1" aria-label="Ir a la página" title="Escribe un número y pulsa Enter">
      <span>/ <span id="pageTotal">25</span></span>
    </div>
    <button class="btn grande" id="bNext" title="Siguiente (→)" aria-label="Siguiente">›</button>
    <button class="btn esc" id="bLast" title="Contraportada (Fin)" aria-label="Ir a la contraportada">»</button>
    <span class="sep esc"></span>
    <button class="btn esc" id="bPlay" title="Reproducción automática (Espacio)" aria-label="Reproducción automática">►</button>
    <button class="btn esc" id="bZoomOut" title="Alejar (−)" aria-label="Alejar">−</button>
    <span class="zoomlbl esc" id="zoomLbl" title="Restablecer zoom (0)">100%</span>
    <button class="btn esc" id="bZoomIn" title="Acercar (+)" aria-label="Acercar">+</button>
    <button class="btn" id="bPdf" title="Guardar como PDF (Ctrl+P → Guardar como PDF)" aria-label="Descargar PDF" style="font-size:12px">PDF</button>
    <button class="btn" id="bFull" title="Pantalla completa (F)" aria-label="Pantalla completa">⛶</button>
  </div>
</nav>

<!-- CAJÓN DE ÍNDICE (se llena solo) -->
<aside class="cajon" id="cajon" aria-label="Índice">
  <button class="btn cerrar" id="bCerrar" aria-label="Cerrar índice">✕</button>
  <div class="kicker" style="color:#c9a3b0">Contenido</div>
  <h2>Índice</h2>
  <a id="pdfLink" class="enlace-pdf" href="#" download hidden>⤓ Descargar PDF (versión incluida)</a>
  <ul class="toc" id="cajonLista"></ul>
</aside>

<div id="impresion" aria-hidden="true"></div>
<noscript><p style="color:#fff;text-align:center">Este boletín requiere JavaScript.</p></noscript>

<!-- DATOS (carpeta datos/): el orden de estas líneas es el orden del libro -->
<script src="datos/config.js"></script>
<script src="datos/00-preliminares.js"></script>
<script src="datos/01-glosarios.js"></script>
<script src="datos/02-demografia.js"></script>
<script src="datos/03-matricula.js"></script>
<script src="datos/04-docentes.js"></script>
<script src="datos/05-servicios-locales.js"></script>
<script src="datos/06-etp.js"></script>
<script src="datos/07-fuentes-contraportada.js"></script>

<!-- SCRIPTS (carpeta js/) -->
<script src="js/donas.js"></script>
<script src="js/flipbook.js"></script>
</body>
</html>
